<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Iris</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="phone">
<header class="topbar"><h1 id="chatTitle" role="button" tabindex="0" aria-label="Open settings">Chat</h1><div class="top-actions"><button class="avatar-stack" id="characters" aria-label="切换角色"></button><button class="icon-button settings-button" id="settings" aria-label="打开设置"></button></div></header>
<section class="conversation" id="conversation" aria-label="聊天记录" aria-live="polite"></section>
<div class="shade" id="shade" hidden></div><section class="sheet" id="sheet" hidden aria-label="功能面板"></section>
<footer class="bottom"><nav class="dock" id="dock" aria-label="Bottom navigation"></nav><form class="composer" id="composer" hidden><div class="composer-tools"><div class="quick-features" id="quickFeatures" hidden><button type="button" class="quick-item" data-quick="语音" aria-label="Voice"><span class="quick-icon" data-icon="mic"></span><span>Voice</span></button><button type="button" class="quick-item" data-quick="视频" aria-label="Video"><span class="quick-icon" data-icon="video"></span><span>Video</span></button><button type="button" class="quick-item" data-quick="图片" aria-label="Image"><span class="quick-icon" data-icon="image"></span><span>Image</span></button><button type="button" class="quick-item" data-quick="转账" aria-label="Transfer"><span class="quick-icon" data-icon="transfer"></span><span>Transfer</span></button><button type="button" class="quick-item" data-quick="定位" aria-label="Location"><span class="quick-icon" data-icon="location"></span><span>Location</span></button><button type="button" class="quick-item" data-quick="听歌" aria-label="Music"><span class="quick-icon" data-icon="music"></span><span>Music</span></button><button type="button" class="quick-item" data-quick="阅读" aria-label="Read"><span class="quick-icon" data-icon="book"></span><span>Read</span></button><button type="button" class="quick-item quick-exit" id="closeInput" aria-label="Exit"><span class="quick-icon" data-icon="arrow"></span><span>Exit</span></button></div><button type="button" class="circle small" id="inputFunctions" aria-label="Show functions" aria-expanded="false" aria-controls="quickFeatures"></button></div><div class="input-wrap"><textarea id="messageInput" rows="1" placeholder="Type a message…" aria-label="Message"></textarea><button type="button" class="emoji" id="emoji" aria-label="Insert emoji"></button></div><button class="circle small" type="button" id="reply" aria-label="Request a reply"></button></form></footer>
<div class="toast" id="toast" role="status" hidden></div>
<section class="settings-screen" id="settingsScreen" hidden aria-label="Settings"><header class="settings-topbar"><button type="button" id="closeSettings" aria-label="返回聊天">Settings</button></header><div class="settings-content" id="settingsContent"></div></section>
<section class="feature-screen" id="featureScreen" hidden aria-label="功能页面"><header class="feature-page-topbar"><div id="featurePageTitle"></div></header><div class="feature-page-content" id="featurePageContent"></div></section>
</main><dialog class="profile-dialog" id="profileDialog" tabindex="-1" aria-labelledby="profileTitle"></dialog><dialog class="profile-dialog character-dialog" id="characterDialog" tabindex="-1" aria-labelledby="characterTitle"></dialog><script src="app.js"></script><script src="profiles.js"></script><script src="importers.js"></script><script src="characters.js"></script></body></html>
